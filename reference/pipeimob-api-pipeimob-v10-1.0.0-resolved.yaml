openapi: 3.0.3
info:
  title: API PipeImob v1.0
  description: >-


    [www.pipeimob.com.br](https://pipeimob.com.br)


    Aqui você tem acesso a todas as informações da coleção de chamadas
    (endpoints) para a **API PIPEIMOB versão 1.0**, que fornece serviços de
    apoio para integrar os serviços oferecidos por nossa plataforma, aos seus
    aplicativos.


    A **API PIPEIMOB v1.0** está implementada em conformidade com o princípio de
    design REST. Nossa API possui recursos orientados a URLs, com códigos HTTP
    para indicar erros.


    Utilizamos funcionalidades HTTP nativas, como verbos de ação POST, PUT, GET,
    DELETE, para operações de leitura e escrita, bem como o modelo básico de
    autenticação HTTP.


    Suportamos chamadas diretas aos recursos/endpoints da API a partir de outras
    origens, CORS (cross-origin resource sharing), permitindo você interagir de
    maneira segura com nossas APIs a partir de aplicações web. Todas as
    respostas da API estão no formato de dados JSON, incluindo erros.


    ### **URL base**


    Use a seguinte URL como base para todas as chamadas nesta API:


    [https://pipeimob.com.br/api/1.1/wf](https://pipeimob.com.br/api/1.1/wf)


    ### **Acesso às rotas por Parceiros Externos**


    Usuários de Parceiros Externos (empresas de Assessoria de Crédito,
    Escreventes de Notas, empresas de Tecnologia/Marketplaces etc) têm, também,
    possibilidade de consulta de detalhes sobre as transações na rota /negocios.


    Deve-se solicitar à equipe do PipeImob as Credenciais de API de determinado
    usuário de tal parceiro, querendo acesso a tal funcionalidade.


    Atenção: a imobiliária &#34;dona&#34; do negócio precisa, para cada
    específico Parceiro, determinar se permite a este o acesso aos dados das
    transações via API. Isto é feito por qualquer Gestor da Imobiliária em
    _Ajustes_ &gt; _Visão Geral_ &gt; _Parceiros_, então clicar sobre o parceiro
    que deseja alterar e, na aba _Níveis de Autorização_, adequar as permissões.


    ### **Acesso Dados Sensíveis**


    Por questões de confiencialidade, conformidade com LGPD e segurança da
    informação, alguns dados sensíveis só podem ser disponibilizados mediante
    solicitação por canais oficiais, feita diretamente pelo responsável da
    imobiliária. Se o usuário não tem a permissão deliberadamente para acesso a
    esses dados, a API retorna apenas os dados comuns.


    Para realizar a solicitação de acesso a dados sensíveis, utilize nosso
    atendimento ao cliente e faça a solicitação através de abertura de um ticket
    em nosso suporte e, após avaliação do trâmite, será disponibilizado o
    acesso.


    ### **Webhooks de Eventos-críticos para Agências e Parceiros**


    A imobiliária pode configurar um endereço de endpoint para ser informada, em
    tempo real, a medida que eventos acontecerem em suas transações. O pedido de
    configuração de uma URL que será o endpoint para o recebimento destes
    eventos deve ser feito pela imobiliária à equipe de suporte do PipeImob.


    Já no caso de Parceiros Externos (empresas de Assessoria de Crédito,
    Escreventes de Notas, empresas de Tecnologia/Marketplaces etc), a
    configuração da URL está disponível no próprio front do sistema, em
    Configurações &gt; Parceiros, por parte da imobiliária que o cadastrou. E,
    tratando-se de um parceiro &#34;geral&#34; (homologado pelo PipeImob), então
    o pedido também deve ser feito à equipe de suporte.


    Os eventos de webhook são sempre enviados para uma mesma URL, tendo a
    seguinte estrutura:


    {  

    &#34;event&#34;: &#34;CHAVES_ENTREGUES&#34;,  

    &#34;event_time&#34;: &#34;2019-08-23T04:00:00Z&#34;,  

    &#34;agencia_slug&#34;: &#34;imobiliariasilva&#34;,  

    &#34;codigo_imovel&#34;: &#34;XPTO&#34;,  

    &#34;codigo_contrato&#34;: &#34;XPTO_CONTRACT&#34;,  

    &#34;codigo_contrato_novo&#34;: &#34;XPTO_CONTRACT_NEW&#34;,  

    &#34;transacao_uniqueId_pipeimob&#34;:
    &#34;0987123101029xx6540842132121x65421&#34;,  

    &#34;subetapa&#34;: &#34;Nome da Subetapa&#34;,  

    &#34;parceiro_incluido_nomeFantasia&#34;: &#34;Parceiro XPTO&#34;,  

    &#34;parceiro_incluido_razaoSocial&#34;: &#34;Parceiro XPTO LTDA&#34;,  

    &#34;parceiro_incluido_tipo&#34;: &#34;Advogado&#34;,  

    &#34;cobranca&#34;: &#34;[https://www.pipeimob.com.br/cobranca/xpto&#34;,<br
    />](https://www.pipeimob.com.br/cobranca/xpto)&#34;etapa_atual&#34;:
    &#34;ESCRITURA&#34;  

    }


    Observações:


    - o campo &#34;subetapa&#34; será enviado apenas no caso de eventos
    &#34;SUBETAPA_ATIVADA&#34; ou &#34;SUBETAPA_CONCLUIDA&#34;;
        
    - os campos &#34;parceiro_incluido_nomeFantasia&#34;,
    &#34;parceiro_incluido_razaoSocial&#34; e &#34;parceiro_incluido_tipo&#34;
    serão enviados apenas no caso do evento &#34;PARCEIRO_INCLUIDO&#34;;
        
    - o campo &#34;cobranca&#34; será enviado apenas no caso de eventos que
    envolvam cobranças bancárias (criadas, pagas ou editadas);
        
    - o campo &#34;etapa_atual&#34; será enviado apenas no caso do evento
    &#34;ETAPA_ALTERADA&#34;;
        
    - o campo &#34;codigo_contrato_novo&#34; será enviado apenas no caso do
    evento &#34;CODIGO_CONTRATO_ALTERADO&#34;;
        
    - no caso dos eventos &#34;COMISSIONADO_REMOVIDO&#34;,
    &#34;COMISSIONADO_INCLUIDO&#34; ou &#34;COMISSIONADO_ALTERADO&#34;, serão
    enviados os campos &#34;comissionado_uniqueId&#34;,
    &#34;comissionado_nome&#34; e &#34;comissionado_cpfCnpj&#34;;
        
    - no caso do evento &#34;COMISSIONADO_ALTERADO&#34;, serão também enviados
    os campos &#34;comissionado_valorAnterior&#34; (tipo _number_) e
    &#34;comissionado_valorAtual&#34; (tipo _number_).
        

    Então, recebido o evento, pode-se utilizar a rota /negocios para o retorno
    de ademais detalhes sobre aquela transação.


    Os eventos atualmente disponíveis (campo _event_ do json) são os seguintes:


    | Event | Descrição |

    | --- | --- |

    | PROPOSTA_ASSINADA_PROPONENTES | A medida que todos os proponentes
    (potenciais compradores) assinam, eletronicamente, uma proposta de compra de
    imóvel |

    | PROPOSTA_ASSINADA_PROPRIETARIOS | A medida que todos os proprietários que
    foram cadastrados assinam, eletronicamente, uma proposta de compra de imóvel
    |

    | TRANSACAO_PREENCHIMENTO_INICIADO | Quando se inicia o preenchimento do
    Formulário de Transação |

    | TRANSACAO_INICIADA | Término do Formulário de Transação e envio do imóvel
    à tela de Negócios |

    | CODIGO_CONTRATO_ALTERADO | Caso, após o início da transação, haja uma
    alteração no Código do Imóvel, isto alterará o Código Sequencial do Contrato
    em curso. Nesta situação, este evento de webhook avisará de tal mudança,
    enviando o código antigo no campo &#34;codigo_contrato&#34;, e o novo no
    campo &#34;codigo_contrato_novo&#34; |

    | ETAPA_ALTERADA | A medida que a etapa da transação por alterada. O nome da
    etapa é um parâmetro configurável por imobiliária. |

    | SUBETAPA_ATIVADA | A medida que uma subetapa na esteira de determinada
    transação é ativada. O título da subetapa será enviado no json. |

    | SUBETAPA_CONCLUIDA | A medida que uma subetapa na esteira de determinada
    transação tem o status alterado para &#34;Concluída&#34;. O título da
    subetapa será enviado no json. |

    | CONTRATO_ASSINADO | A medida que o campo de &#34;data de assinatura do
    CCV&#34; é preenchido para determina transação |

    | COBRANCA_SINAL_GERADA | A medida que for gerada uma cobrança do tipo
    &#34;Sinal / Entrada&#34; associada àquela transação |

    | COBRANCA_SINAL_EDITADA_DATA | A medida que for gerada uma cobrança do tipo
    &#34;Sinal / Entrada&#34; associada àquela transação tiver sua data de
    vencimento editada |

    | COBRANCA_SINAL_EDITADA_VALOR | A medida que for gerada uma cobrança do
    tipo &#34;Sinal / Entrada&#34; associada àquela transação tiver seu valor
    editado |

    | COBRANCA_SINAL_EXCLUIDA | A medida que for gerada uma cobrança do tipo
    &#34;Sinal / Entrada&#34; associada àquela transação tiver sido cancelada |

    | COBRANCA_SINAL_PAGA | A medida que for paga uma cobrança do tipo
    &#34;Sinal / Entrada&#34; associada àquela transação |

    | COBRANCA_COMISSAO_GERADA | A medida que for gerada uma cobrança do tipo
    &#34;Comissão&#34; associada àquela transação |

    | COBRANCA_COMISSAO_EDITADA_DATA | A medida que for gerada uma cobrança do
    tipo &#34;Comissão&#34; associada àquela transação tiver sua data de
    vencimento editada |

    | COBRANCA_COMISSAO_EDITADA_VALOR | A medida que for gerada uma cobrança do
    tipo &#34;Comissão&#34; associada àquela transação tiver seu valor editado |

    | COBRANCA_COMISSAO_EXCLUIDA | A medida que for gerada uma cobrança do tipo
    &#34;Comissão&#34; associada àquela transação tiver sido cancelada |

    | COBRANCA_COMISSAO_PAGA | A medida que for paga uma cobrança do tipo
    &#34;Comissão&#34; associada àquela transação |

    | CONTRATO_CANCELADO | O campo de &#34;data de assinatura do CCV&#34; estava
    preenchido, e agora foi apagado |

    | ESCRITURA_LAVRADA | A medida que o campo de &#34;data de lavratura de
    escritura&#34; (ou de assinatura do contrato de financiamento, se o caso) é
    preenchido para determina transação |

    | CHAVES_ENTREGUES | A medida que o campo de &#34;data de entrega das
    chaves&#34; (entrega da posse) é preenchido para determina transação |

    | REGISTRO_PUBLICO | A medida que o campo de &#34;data de registro
    público&#34; (junto ao Cartório de Imóveis) é preenchido para determina
    transação |

    | ARQUIVAMENTO_VENDA_FINALIZADA | A medida que uma transação for arquivada
    utilizando-se o motivo &#34;Transação Finalizada&#34; |

    | ARQUIVAMENTO_VENDA_CANCELADA | A medida que uma transação for arquivada
    sem que tenha se utilizado do motivo &#34;Transação Finalizada&#34; |

    | PARCEIRO_INCLUIDO | A inclusão de qualquer parceiro externo àquela
    transação, como Advogados, empresas de Tecnologia e Marketplace,
    Imobiliárias e Corretores externos, etc. |

    | COMISSIONADO_REMOVIDO | Uma vez que, posteriormente ao envio da transação
    (fazendo constar à tela de negócios), um dos comissionados que até então se
    encontrava à estrutura de detentores de direitos sobre a comissão, for
    removido |

    | COMISSIONADO_INCLUIDO | Uma vez que, posteriormente ao envio da transação
    (fazendo constar à tela de negócios), for incluído um novo comissionado que
    até então não se encontrava à estrutura de detentores de direitos sobre a
    comissão |

    | COMISSIONADO_ALTERADO_VALOR | Uma vez que, posteriormente ao envio da
    transação (fazendo constar à tela de negócios), altera-se o valor da
    comissão de um dos que já se encontrava à estrutura de detentores de
    direitos sobre a comissão |


    ### **Polling vs. Webhooks e limites da API**


    Enviamos webhooks para grande parte dos eventos-críticos que envolvem os
    negócios e, por isto, o _polling_ poderá ser considerada uma má prática no
    uso da API e poderá gerar o bloqueio temporário da credencial.


    **Polling** representa a periódica requisição da API para verificar se há
    novas informações ou atualizações, sendo um método ineficiente e que
    sobrecarrega o servidor, especialmente se as atualizações são raras,
    desperdiçando-se recursos de ambos os lados.


    **Webhooks**, por outro lado, permitem que o servidor envie dados
    diretamente para o cliente assim que uma atualização relevante ocorre. Isso
    elimina a necessidade de requisições periódicas, tornando o processo mais
    eficiente. O servidor notifica o cliente apenas quando necessário,
    economizando recursos e garantindo que as informações sejam entregues em
    tempo real.


    A rota de negócios da API do PipeImob comporta um máximo de 10 (dez)
    requisições diárias sem a utilização de filtros de negócios (código de
    imóvel, código de contrato ou uniqueID) - ou seja, para um retorno que
    contemple todas as transações, dentro de um intervalo de tempo (de até 30
    dias). Tratando-se de requisições que se utilizam de filtro de um negócio
    específico (recuperando, então, somente aquele negócio, porém com mais
    profundidade em termos de detalhes), serão consideradas aceitáveis até 100
    (cem) requisições diárias, sendo que volumes acima disto poderão ser
    considerados _polling_ e gerarão a interrupção do serviço.


    ### **Bearer Authorization no Header**


    Os webhooks são enviados com um _header_ no formato abaixo:


    - Authorization Bearer _token_
        

    Sendo que o token é versionado por imobiliária e/ou franqueadora e/ou
    transação. Caso tenha interesse em usar tal header como validador de
    recebimento de mensageria, entre em contato com nosso suporte a respeito.
