  /api/1.1/wf/negocios_lista:
    post:
      tags:
        - Negócios
      summary: Lista de Negócios
      description: >-
        Esta rota retornará a lista de transações que estão em curso, assim como
        aquelas que foram já arquivadas.


        O retorno contempla somente o uniqueID de cada transação, cujos detalhes
        poderão ser recuperados na rota própria.


        É obrigatório o envio no _body_ do filtro especificando a data da última
        modificação naquela transação - ou seja, deve-se retornar apenas
        transações cujos registros tiveram alguma (qualquer) alteração
        posteriormente à data selecionada, conforme modelo:


        {"date_last_modified": "AAAA-MM-DD hh:mm:ss"}


        No caso do usuário da API ter perfil de "imobiliária", serão retornadas
        as transações da mesma, assim como aquelas nas quais tal imobiliária foi
        incluída como comissionada.


        No caso do usuário da API ter perfil de "franquia", serão retornadas as
        transações de todas as imobiliárias de tal rede, assim como aquelas nas
        quais tais imobiliárias foram incluídas como comissionadas.


        No caso do usuário da API ter o perfil de "parceiro", serão retornadas
        as transações que incluíram tal parceiro como envolvido, assim como toas
        as transações de imobiliárias que deram autorização total a acesso a
        dados via API àquele parceiro.
      operationId: listaDeNegCios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wf_negocios_lista_body'
            examples:
              Lista de Negócios:
                value:
                  date_last_modified: '2024-09-05 23:59:59'
